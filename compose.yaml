name: antre

x-build: &build
    context: .
    args:
        VITE_APP_NAME: ${APP_NAME:-Antre}
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:?Set REVERB_APP_KEY in .env}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:-}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-443}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-https}

x-runtime-environment: &runtime-environment
    APP_NAME: ${APP_NAME:-Antre}
    APP_ENV: production
    APP_KEY: ${APP_KEY:?Set APP_KEY in .env}
    APP_DEBUG: 'false'
    APP_URL: ${APP_URL:?Set APP_URL in .env}
    APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Makassar}
    APP_LOCALE: ${APP_LOCALE:-id}
    APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-en}
    TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    LOG_CHANNEL: stderr
    LOG_LEVEL: ${LOG_LEVEL:-warning}
    DB_CONNECTION: mariadb
    DB_HOST: db
    DB_PORT: 3306
    DB_DATABASE: ${DB_DATABASE:-antre}
    DB_USERNAME: ${DB_USERNAME:-antre}
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    SESSION_DRIVER: database
    SESSION_SECURE_COOKIE: 'true'
    SESSION_SAME_SITE: lax
    CACHE_STORE: database
    QUEUE_CONNECTION: sync
    BROADCAST_CONNECTION: reverb
    FILESYSTEM_DISK: local
    REVERB_APP_ID: ${REVERB_APP_ID:?Set REVERB_APP_ID in .env}
    REVERB_APP_KEY: ${REVERB_APP_KEY:?Set REVERB_APP_KEY in .env}
    REVERB_APP_SECRET: ${REVERB_APP_SECRET:?Set REVERB_APP_SECRET in .env}
    REVERB_HOST: reverb
    REVERB_PORT: 8080
    REVERB_SCHEME: http
    REVERB_SERVER_HOST: 0.0.0.0
    REVERB_SERVER_PORT: 8080
    REVERB_ALLOWED_ORIGINS: ${REVERB_ALLOWED_ORIGINS:?Set REVERB_ALLOWED_ORIGINS in .env}

services:
    db:
        image: mariadb:11.4
        restart: unless-stopped
        command:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
        environment:
            MARIADB_DATABASE: ${DB_DATABASE:-antre}
            MARIADB_USER: ${DB_USERNAME:-antre}
            MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
            MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
        volumes:
            - ${ANTRE_DATA_DIR:-./docker-data}/database:/var/lib/mysql
        healthcheck:
            test:
                - CMD-SHELL
                - mariadb-admin ping -h 127.0.0.1 -u root -p"$${MARIADB_ROOT_PASSWORD}" --silent
            interval: 5s
            timeout: 5s
            retries: 20

    app:
        build:
            <<: *build
            target: runtime
        restart: unless-stopped
        environment:
            <<: *runtime-environment
            RUN_MIGRATIONS: 'true'
            RUN_OPTIMIZE: 'true'
        volumes:
            - ${ANTRE_DATA_DIR:-./docker-data}/storage:/var/www/html/storage
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test:
                - CMD-SHELL
                - php -r '$$socket = @fsockopen("127.0.0.1", 9000); exit($$socket === false ? 1: 0);'
            interval: 10s
            timeout: 5s
            retries: 10

    reverb:
        build:
            <<: *build
            target: runtime
        restart: unless-stopped
        environment:
            <<: *runtime-environment
            RUN_MIGRATIONS: 'false'
            RUN_OPTIMIZE: 'true'
        command:
            - php
            - artisan
            - reverb:start
            - --host=0.0.0.0
            - --port=8080
        depends_on:
            app:
                condition: service_healthy
        healthcheck:
            test:
                - CMD-SHELL
                - php -r '$$socket = @fsockopen("127.0.0.1", 8080); exit($$socket === false ? 1: 0);'
            interval: 10s
            timeout: 5s
            retries: 10

    web:
        build:
            <<: *build
            target: web
        restart: unless-stopped
        depends_on:
            app:
                condition: service_healthy
            reverb:
                condition: service_healthy
        ports:
            - 127.0.0.1:${ANTRE_HTTP_PORT:-8080}:80
        healthcheck:
            test:
                - CMD-SHELL
                - wget -q -O - http://127.0.0.1/up >/dev/null || exit 1
            interval: 10s
            timeout: 5s
            retries: 10
